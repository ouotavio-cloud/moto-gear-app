apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.motogear.app"
    compileSdk rootProject.ext.compileSdkVersion

    // Versão vem do CI a cada deploy (o mesmo número que carimba o versao.js e a
    // tag do release, para o aviso de "nova versão" funcionar). Sem as variáveis,
    // cai no padrão para builds locais. Fica em `def` fora do defaultConfig para
    // evitar a ambiguidade do Groovy entre `versionCode(...)` e `.toInteger()`.
    def buildNumero = (System.getenv("MOTOGEAR_BUILD") ?: "2").toInteger()
    def versaoNome = System.getenv("MOTOGEAR_VERSAO") ?: "2.0.0"

    defaultConfig {
        applicationId "com.motogear.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildNumero
        versionName versaoNome
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Um APK por arquitetura de CPU. O APK único carregava as bibliotecas
    // nativas do leitor de código de barras para as quatro arquiteturas (~19 MB
    // só nisso), sendo que x86/x86_64 só aparecem em emulador. Cada celular
    // baixa apenas o que usa.
    //
    // Também geramos o APK universal (universalApk true): é ele que o aviso de
    // "nova versão" baixa, por instalar em qualquer aparelho sem o app precisar
    // adivinhar a arquitetura do celular.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    // Assinatura vem de variáveis de ambiente: a chave nunca entra no repositório.
    // Sem elas, o build de release sai sem assinar (útil para checar compilação).
    signingConfigs {
        release {
            def caminho = System.getenv("MOTOGEAR_KEYSTORE")
            if (caminho) {
                storeFile file(caminho)
                storePassword System.getenv("MOTOGEAR_KEYSTORE_SENHA")
                keyAlias System.getenv("MOTOGEAR_KEY_ALIAS") ?: "motogear"
                keyPassword System.getenv("MOTOGEAR_KEY_SENHA") ?: System.getenv("MOTOGEAR_KEYSTORE_SENHA")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("MOTOGEAR_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'br.com.uol.pagseguro.plugpagservice.wrapper:wrapper:1.35.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

name: Teste manual - Point virtual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    name: Validar Orders API sem maquininha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar teste oficial no terminal SBX0000001
        env:
          MERCADO_PAGO_TEST_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_TEST_ACCESS_TOKEN }}
        run: node server/scripts/testar-point-virtual.mjs
